apiVersion: mc-operator/v1

proxy:
  enabled: true
  version: "3.3.0"
  externalPort: 25565
  forwardingMode: modern

servers:
  - name: lobby
    type: paper
    version: "1.20.4"
    port: 25566
    resource:
      memoryMB: 2048
    configDir: configs/lobby
    plugins:
      - name: LuckPerms
        source: url
        path: https://download.luckperms.net/1526/bukkit/loader/LuckPerms-Bukkit-5.4.102.jar
      - name: HubPlugin
        source: local
        path: plugins/hub/HubPlugin.jar

  - name: survival
    type: paper
    version: "1.20.4"
    port: 25567
    resource:
      memoryMB: 4096
    configDir: configs/survival
    env:
      DIFFICULTY: hard

  - name: creative
    type: paper
    version: "1.20.4"
    port: 25568
    resource:
      memoryMB: 3072
    configDir: configs/creative
